{% set name = "metatomic-torch" %}
{% set version = "0.1.12.rc1" %}
{% set git_rev = "a46c3a7e79dd24d35217b7bb9176420823723242" %}

package:
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  git_url: https://github.com/metatensor/metatomic.git
  git_rev: {{ git_rev }}
  depth: 1

build:
  script:
    - cd python/metatomic_ase
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cd ../metatomic_torch
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  string: py{{ CONDA_PY }}_h{{ PKG_HASH }}_git.{{ git_rev[:7] }}_{{ PKG_BUILDNUM }}
  script_env:
    - METATOMIC_NO_LOCAL_DEPS='1'
    - METATOMIC_TORCH_PYTHON_USE_EXTERNAL_LIB='ON'
    - METATOMIC_TORCH_BUILD_WITH_TORCH_VERSION='2.10.*'
  ignore_run_exports:
    # pytorch is only used as a Python package, all the pytorch version pinning
    # is happening in libmetatomic-torch
    - libtorch
    - pytorch

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    # Nothing will be built but we need a correct env to make pip happy
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - make
  host:
    - python
    - pip
    - setuptools >=77
    - packaging >=26
    # We build against the CPU version of torch to not have to deal with CUDA compilers
    # (torch's CMake targets tries to find CUDA compilers even when there is no CUDA
    # code to build). This does not impact the `run` dependency, since torch's
    # `run_exports` are variant agnostic
    - libtorch * cpu*
    - pytorch =2.10.*=cpu*
    - libmetatomic-torch >=0.1.12.rc1,<0.2.0
    - python-metatensor-torch >=0.9.0.rc5,<0.10.0
    - python-metatensor-operations >=0.5.0.rc2,<0.6.0
  run:
    - python
    - pytorch =2.10.*=cpu*
    - libmetatomic-torch >=0.1.12.rc1,<0.2.0
    - python-metatensor-torch >=0.9.0.rc5,<0.10.0
    - python-metatensor-operations >=0.5.0.rc2,<0.6.0
    - python-vesin

test:
  imports:
    - metatomic.torch
    - metatomic_ase
  commands:
    - python -c "import importlib.metadata as m; print(m.version('metatomic-torch')); print(m.version('metatomic-ase'))"
    - pip check
  requires:
    - pip

about:
  home: https://github.com/metatensor/metatomic
  summary: Python bindings for metatomic-torch
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://docs.metatensor.org/metatomic/

extra:
  recipe-maintainers:
    - PicoCentauri
    - Luthaf
    - Haozeke
